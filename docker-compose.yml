services:
  mysql:
    image: mysql:8
    container_name: food-flow-manager-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: food_flow_manager
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - food-flow-manager-mysql-data:/var/lib/mysql
      - "./assets/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - food-flow-manager-net

  redis:
    image: redis:8.6.2
    container_name: food-flow-manager-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-1234}"]
    volumes:
      - food-flow-manager-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - food-flow-manager-net

  food-flow-manager:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: food-flow-manager-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/food_flow_manager?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 0
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
    networks:
      - food-flow-manager-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    # The web profile is opt-in so the existing backend-only deployment remains unchanged.
    profiles: ["web"]
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: food-flow-manager-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    networks:
      - food-flow-manager-net
    depends_on:
      food-flow-manager:
        condition: service_started

networks:
  food-flow-manager-net:
    name: food-flow-manager
    driver: bridge

volumes:
  food-flow-manager-mysql-data:
    name: food-flow-manager-mysql-data
  food-flow-manager-redis-data:
    name: food-flow-manager-redis-data
