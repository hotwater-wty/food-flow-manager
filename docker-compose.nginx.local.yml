services:
  nginx:
    image: nginx:stable-alpine
    container_name: food-flow-manager-nginx-local
    ports:
      - "${NGINX_LOCAL_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./apps/customer/dist:/usr/share/nginx/html/customer:ro"
      - "./apps/admin/dist:/usr/share/nginx/html/admin:ro"
      - "./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro"
